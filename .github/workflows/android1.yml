
name: Build Exam Photo Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK paths
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      # 4. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # 5. Install required Android SDK components
      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Set up Gradle caching
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Extract and validate project ZIP
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip'
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one ZIP file."
            exit 1
          fi

          mkdir -p extracted

          unzip -q "${ZIP_FILES[0]}" -d extracted \
            -x '__MACOSX/*'

          mapfile -t WRAPPERS < <(
            find extracted -type f -name gradlew \
              -not -path '*/__MACOSX/*'
          )

          if [ "${#WRAPPERS[@]}" -ne 1 ]; then
            echo "Expected exactly one Gradle wrapper."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${WRAPPERS[0]}")"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Android app module not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Gradle settings file missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # 9. Find and prepare APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -exec cp {} artifacts/ \;

          if ! find artifacts -name '*.apk' | grep -q .; then
            echo "APK generation failed."
            exit 1
          fi

          ls -lh artifacts/

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exam-Photo-Studio-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
